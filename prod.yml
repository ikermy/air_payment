services:
  # ── air_pay — обработчик криптоплатежей ─────────────────────────────────────
  pay:
    build:
      context: .
      dockerfile: Dockerfile
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: 1
    labels:
      logging: loki
      app: air
      service: pay
      tier: backend
    image: pay:dev
    container_name: pay_app
    restart: unless-stopped
    environment:
      # ── База данных (локальный сервер на хосте) ─────────────────────────────
      - DB_HOST=air_db:3306
      - DB_NAME=air
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}

      # ── ByBit конфигурация ──────────────────────────────────────────────────
      - TESTNET=false
      - API_KEY_FILE=/run/secrets/api_key
      - SECRET_KEY_FILE=/run/secrets/secret_key

      # ── Домен и порты смежных сервисов ───────────────────────────────────────
      - REAL_URL=${DOMAIN}

      # ── Логирование ──────────────────────────────────────────────────────────
      - LOG_LEVEL=info

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - monitoring_shared
      - air_shared

    volumes:
      - ./secrets/api_key.txt:/run/secrets/api_key:ro
      - ./secrets/secret_key.txt:/run/secrets/secret_key:ro

networks:
  monitoring_shared:
    external: true
  air_shared:
    external: true